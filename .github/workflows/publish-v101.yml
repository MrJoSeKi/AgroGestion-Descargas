name: Publicar AgroGestión V1.0.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v101.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOWNLOAD_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-27ac-81f4-a1ec-9a475a1c60ca/raw?se=2026-11-19T18%3A08%3A41Z&sp=r&sv=2026-06-06&sr=b&scid=e13271c1-ceca-5c8f-8b68-609017a0cbef&skoid=a63e6f05-dc2f-4fa5-b0e3-b1cb9c0893bb&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-19T10%3A01%3A59Z&ske=2026-11-20T10%3A01%3A59Z&sks=b&skv=2026-06-06&sig=Jo4Da6c%2By/IY27HFkjCZ3RZI3wgGUQjuAU6Un/aWA4Q%3D"
      EXPECTED_SHA256: "94e161415a9e13d773cb60a9bde52890b3912d9c31f902fb863b8c7fd8031a17"
    steps:
      - name: Descargar paquete firmado de producción
        uses: actions/checkout@v4
      - name: Obtener y verificar APK
        run: |
          set -euo pipefail
          curl -fL --retry 2 "$DOWNLOAD_URL" -o /tmp/agrogestion-release.zip
          mkdir -p /tmp/agrogestion-release
          unzip -oq /tmp/agrogestion-release.zip -d /tmp/agrogestion-release
          APK="/tmp/agrogestion-release/AgroGestion-v1.0.1.apk"
          test -s "$APK"
          echo "$EXPECTED_SHA256  $APK" | sha256sum --check
          mkdir -p .
          cp "$APK" AgroGestion-v1.0.1.apk
      - name: Actualizar página de descarga y checksum
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          html = p.read_text()
          if "AgroGestion-v1.0.0.apk" not in html or "1.0.0" not in html:
              raise SystemExit("La página no contiene las referencias esperadas de V1.0.0")
          html = html.replace("AgroGestion-v1.0.0.apk", "AgroGestion-v1.0.1.apk")
          html = html.replace("1.0.0", "1.0.1")
          p.write_text(html)
          PY
          printf '%s  %s\n' "$EXPECTED_SHA256" "AgroGestion-v1.0.1.apk" > SHA256SUMS.txt
          rm .github/workflows/publish-v101.yml
      - name: Publicar actualización en la página
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AgroGestion-v1.0.1.apk index.html SHA256SUMS.txt .github/workflows/publish-v101.yml
          git commit -m "Publish AgroGestion V1.0.1 with clean new accounts"
          git push origin main
