name: Generate WhatsApp preview PNG

on:
  push:
    branches:
      - main
    paths:
      - 'og-agrogestion.svg'
      - '.github/workflows/generate-og-image.yml'

permissions:
  contents: write

jobs:
  generate-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Convert the social preview to PNG
        run: |
          python -m pip install --upgrade pip
          python -m pip install cairosvg pillow
          python - <<'PY'
          import cairosvg
          from PIL import Image

          cairosvg.svg2png(
              url="og-agrogestion.svg",
              write_to="og-agrogestion.png",
              output_width=1200,
              output_height=630,
          )

          image = Image.open("og-agrogestion.png").convert("RGB")
          if image.size != (1200, 630):
              raise SystemExit(f"Unexpected image size: {image.size}")
          image.save("og-agrogestion.png", format="PNG", optimize=True)

          check = Image.open("og-agrogestion.png")
          check.verify()
          print("Valid PNG generated:", check.size)
          PY

      - name: Commit the generated preview image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-agrogestion.png
          if git diff --cached --quiet; then
            echo "The preview PNG is already up to date."
            exit 0
          fi
          git commit -m "Generate valid PNG for WhatsApp preview"
          git push
